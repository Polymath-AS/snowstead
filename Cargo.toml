[workspace]
resolver = "3"
members = ["apps/cli", "pkg/protocol", "workers/server"]
default-members = ["apps/cli"]

[workspace.dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false }
clap = "4.6.7"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
hegeltest = { version = "0.51.0", features = ["static-engine"] }
hex = "0.4.3"
hmac = "0.13.0"
hotpath = { version = "0.30.3", default-features = false }
httpdate = "1.0.3"
object_store = { version = "0.14.2", default-features = false }
pkg-config = "0.3.34"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.20"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.29.0"
zeroize = "1.9.1"
zstd = "0.14.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
