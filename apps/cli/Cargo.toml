[package]
name = "snowstead-cli"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../../LICENSE"
description = "Snowstead binary cache upload client"

[[bin]]
name = "snowstead"
path = "src/main.rs"

[[example]]
name = "snowstead"
path = "examples/hotpath.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(snowstead_hotpath)', 'cfg(snowstead_local)'] }

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
futures-util.workspace = true
hex.workspace = true
indicatif = "0.18.6"
console = "0.16.6"
rand.workspace = true
reqwest = { workspace = true, features = ["rustls", "json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[build-dependencies]
pkg-config.workspace = true

[dev-dependencies]
hegeltest.workspace = true
hotpath = { workspace = true, features = ["hotpath", "threads"] }
libc = "0.2.191"
sha2.workspace = true
zstd = { workspace = true, features = ["pkg-config"] }
