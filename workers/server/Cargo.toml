[package]
name = "snowstead-server"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../../LICENSE"

[features]
default = []
# Compile-time only: normal builds do not link hotpath or activate snitch.
profiling = ["dep:hotpath"]
# Vendor-neutral instrumentation for embedding applications.
observability = [
    "dep:log",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
async-trait.workspace = true
aws-credential-types = "1.3.1"
aws-sigv4 = "1.6.5"
axum = { workspace = true, features = ["http1", "http2", "tokio", "json", "matched-path", "original-uri", "query"] }
base64.workspace = true
chrono = { workspace = true, features = ["now"] }
ed25519-dalek.workspace = true
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
http-body-util = "0.1"
hotpath = { workspace = true, optional = true, features = ["hotpath"] }
httpdate.workspace = true
log = { version = "0.4", optional = true }
object_store = { workspace = true, features = ["aws"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"], optional = true }
reqwest = { workspace = true, features = ["rustls", "json", "query"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
snowstead-protocol = { path = "../../pkg/protocol" }
sha2.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "macros", "migrate"] }
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt", "io-util"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false, optional = true }
uuid = { workspace = true, features = ["v7"] }
zeroize.workspace = true

[build-dependencies]
pkg-config.workspace = true

[dev-dependencies]
hegeltest.workspace = true
tower = { workspace = true, features = ["util"] }
zstd = { workspace = true, features = ["pkg-config"] }
